<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Find the Letter</title><link rel="stylesheet" href="style.css"></head>
<body><main class="booklet"><img src="pomi-page-3.png" alt="Find the Letter" class="page-image">
<section class="controls"><h2>🔎 Find the Letter!</h2><p>Tap the letter that matches the one shown.</p><div id="findArea"><div class="activity-card"><h3>Find: A</h3><div class="grid"><button class="choice" data-target="A" data-letter="E" onclick="pick(this)">E</button><button class="choice" data-target="A" data-letter="Q" onclick="pick(this)">Q</button><button class="choice" data-target="A" data-letter="G" onclick="pick(this)">G</button><button class="choice" data-target="A" data-letter="A" onclick="pick(this)">A</button><button class="choice" data-target="A" data-letter="R" onclick="pick(this)">R</button></div></div><div class="activity-card"><h3>Find: B</h3><div class="grid"><button class="choice" data-target="B" data-letter="D" onclick="pick(this)">D</button><button class="choice" data-target="B" data-letter="B" onclick="pick(this)">B</button><button class="choice" data-target="B" data-letter="P" onclick="pick(this)">P</button><button class="choice" data-target="B" data-letter="M" onclick="pick(this)">M</button><button class="choice" data-target="B" data-letter="G" onclick="pick(this)">G</button></div></div><div class="activity-card"><h3>Find: C</h3><div class="grid"><button class="choice" data-target="C" data-letter="K" onclick="pick(this)">K</button><button class="choice" data-target="C" data-letter="X" onclick="pick(this)">X</button><button class="choice" data-target="C" data-letter="C" onclick="pick(this)">C</button><button class="choice" data-target="C" data-letter="N" onclick="pick(this)">N</button><button class="choice" data-target="C" data-letter="Z" onclick="pick(this)">Z</button></div></div><div class="activity-card"><h3>Find: D</h3><div class="grid"><button class="choice" data-target="D" data-letter="P" onclick="pick(this)">P</button><button class="choice" data-target="D" data-letter="D" onclick="pick(this)">D</button><button class="choice" data-target="D" data-letter="Q" onclick="pick(this)">Q</button><button class="choice" data-target="D" data-letter="T" onclick="pick(this)">T</button><button class="choice" data-target="D" data-letter="S" onclick="pick(this)">S</button></div></div><div class="activity-card"><h3>Find: E</h3><div class="grid"><button class="choice" data-target="E" data-letter="F" onclick="pick(this)">F</button><button class="choice" data-target="E" data-letter="Y" onclick="pick(this)">Y</button><button class="choice" data-target="E" data-letter="L" onclick="pick(this)">L</button><button class="choice" data-target="E" data-letter="E" onclick="pick(this)">E</button><button class="choice" data-target="E" data-letter="J" onclick="pick(this)">J</button></div></div></div><div class="score" id="score">0 / 5 correct</div><div class="message" id="message"></div><a id="next" class="navbtn next" href="pomi-page-4.html">NEXT →</a><div class="footer-nav"><a class="navbtn" href="pomi-page-2.html">← BACK</a><a class="navbtn" href="pomi-page-4.html">NEXT →</a><a class="navbtn" href="index.html">🏠 HOME</a></div></section></main>
<script>let found=0;
function pick(b){
 if(b.classList.contains('correct'))return;
 const ok=b.dataset.letter===b.dataset.target;
 if(ok){b.classList.add('correct');b.disabled=true;found++;document.getElementById('score').textContent=found+' / 5 correct';
   if(found===5){markPomiDone(3);document.getElementById('message').textContent='🎉 Excellent! You found all five letters!';document.getElementById('next').style.display='inline-block';}
 }else{b.classList.add('wrong');document.getElementById('message').textContent='😊 Try again! Find the matching letter.';setTimeout(()=>b.classList.remove('wrong'),300);}
}</script><script src="app.js"></script></body></html>
