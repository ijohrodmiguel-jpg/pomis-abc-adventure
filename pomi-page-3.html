<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find the Letter</title>
<link rel="stylesheet" href="style.css">

<style>
.interactive-page{
    position:relative;
    width:100%;
    line-height:0;
    touch-action:manipulation;
}

.interactive-page .page-image{
    width:100%;
    height:auto;
    display:block;
}

/* Invisible clickable areas */
.letter-hotspot{
    position:absolute;
    width:8.6%;
    aspect-ratio:1;
    padding:0;
    border:0;
    border-radius:18%;
    background:transparent;
    color:transparent;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.letter-hotspot:hover{
    box-shadow:0 0 0 4px rgba(174,79,230,.28);
}

.letter-hotspot.correct{
    box-shadow:0 0 0 6px rgba(55,190,90,.85);
    background:rgba(55,190,90,.16);
}

.letter-hotspot.wrong{
    box-shadow:0 0 0 5px rgba(240,70,70,.8);
    background:rgba(240,70,70,.12);
    animation:shake .22s linear 2;
}

.letter-hotspot:disabled{
    cursor:default;
}

@keyframes shake{
    0%,100%{
        transform:translateX(0);
    }
    25%{
        transform:translateX(-4px);
    }
    75%{
        transform:translateX(4px);
    }
}

/* Row positions */
.find-a{top:27.2%;}
.find-b{top:41.7%;}
.find-c{top:55.9%;}
.find-d{top:70.2%;}
.find-e{top:84.4%;}

/* Column positions */
.p1{left:10%;}
.p2{left:26.7%;}
.p3{left:43.5%;}
.p4{left:60.2%;}
.p5{left:77%;}
</style>
</head>

<!-- =========================
     GAME JAVASCRIPT
========================= -->

<script>

let found = 0;

function pick(button){

    /* Prevent clicking an already-correct answer */
    if(button.disabled){
        return;
    }

    /* Check the selected letter */
    if(button.dataset.letter === button.dataset.target){

        /* Correct answer */
        button.classList.add('correct');
        button.disabled = true;

        found++;

        /* Update score */
        document.getElementById('score').textContent =
            found + ' / 5 correct';

        /* Show success message */
        document.getElementById('message').textContent =
            '🎉 Correct! Great job!';

        /* When all five are completed */
        if(found === 5){

            markPomiDone(3);

            document.getElementById('message').textContent =
                '🎉 Excellent! You found all five letters!';

            /* Show the ONE NEXT button */
            document.getElementById('next').style.display =
                'inline-block';
        }

    }else{

        /* Wrong answer */
        button.classList.add('wrong');

        document.getElementById('message').textContent =
            '😊 Try again! Find the matching letter.';

        setTimeout(function(){
            button.classList.remove('wrong');
        },450);
    }
}

</script>
