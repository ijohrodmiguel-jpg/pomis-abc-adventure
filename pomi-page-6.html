<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>What's Missing</title><link rel="stylesheet" href="style.css"></head>
<body><main class="booklet"><img src="pomi-page-6.png" alt="What's Missing" class="page-image">
<section class="controls"><h2>❓ What's Missing?</h2>
<p>Choose the missing letter in each sequence.</p>
<div id="missing"></div><div class="score" id="score">0 / 4 correct</div><div class="message" id="message"></div>
<a id="next" class="navbtn next" href="pomi-page-7.html">NEXT →</a><div class="footer-nav"><a class="navbtn" href="pomi-page-5.html">← BACK</a><a class="navbtn" href="pomi-page-7.html">NEXT →</a><a class="navbtn" href="index.html">🏠 HOME</a></div></section></main>
<script>const qs=[
 ['A B _ D E F',['C','G','H'],'C'],
 ['G H I _ K L',['J','M','N'],'J'],
 ['M N _ P Q R',['O','S','T'],'O'],
 ['S _ U V W X',['T','Y','Z'],'T']
];
let n=0;
const m=document.getElementById('missing');
qs.forEach((q,i)=>{
 const box=document.createElement('div');box.className='quiz-q activity-card';
 box.innerHTML='<strong>'+q[0]+'</strong><div class="grid"></div>';
 q[1].forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.onclick=()=>ansMissing(b,x,q[2],box);box.querySelector('.grid').appendChild(b)});
 m.appendChild(box);
});
function ansMissing(b,x,c,box){
 if(box.dataset.done)return;
 if(x===c){b.classList.add('correct');box.dataset.done='1';n++;document.getElementById('score').textContent=n+' / 4 correct';
   if(n===4){markPomiDone(6);document.getElementById('message').textContent='🎉 Wonderful! You found every missing letter!';document.getElementById('next').style.display='inline-block';}
 }else{b.classList.add('wrong');document.getElementById('message').textContent='😊 Try again! Look at the alphabet order.';setTimeout(()=>b.classList.remove('wrong'),300);}
}</script><script src="app.js"></script></body></html>
